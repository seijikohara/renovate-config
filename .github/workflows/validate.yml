name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: 44.199.2

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Without --no-global, the validator would check a file argument as global
      # (self-hosted) config instead of as a preset.
      - name: Validate the shared preset
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" renovate-config-validator --strict --no-global default.json5
      - name: Validate the repository config
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" renovate-config-validator --strict
